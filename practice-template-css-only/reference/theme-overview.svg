<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">四套 CSS-only template 版面藍圖</title>
  <desc id="desc">Simple、Elegant、Cyber、Colorful 四種不同導覽位置與視覺架構。</desc>
  <defs>
    <linearGradient id="pop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7a9df"/><stop offset=".5" stop-color="#fff7fc"/><stop offset="1" stop-color="#a9edf3"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1440" height="900" fill="#edf0f5"/>
  <text x="70" y="72" font-family="system-ui,sans-serif" font-size="34" font-weight="700" fill="#172033">CSS-only Atlas · Template Overview</text>
  <text x="70" y="108" font-family="system-ui,sans-serif" font-size="18" fill="#667085">同一份 HTML，四種 layout architecture 與 signature effect</text>

  <g transform="translate(70 150)" filter="url(#shadow)">
    <rect width="620" height="290" rx="18" fill="#f6f7fb"/>
    <text x="28" y="38" font-family="system-ui,sans-serif" font-size="23" font-weight="700" fill="#172033">A · Simple</text>
    <rect x="28" y="58" width="564" height="34" rx="8" fill="#fff" stroke="#dfe3ec"/>
    <g fill="#3157ff"><rect x="48" y="71" width="52" height="8" rx="4"/><rect x="116" y="71" width="52" height="8" rx="4"/><rect x="184" y="71" width="52" height="8" rx="4"/></g>
    <rect x="28" y="112" width="350" height="62" rx="10" fill="#fff" stroke="#dfe3ec"/>
    <rect x="394" y="112" width="198" height="62" rx="10" fill="#cad5ff"/>
    <rect x="28" y="194" width="174" height="62" rx="10" fill="#fff" stroke="#dfe3ec"/><rect x="220" y="194" width="174" height="62" rx="10" fill="#fff" stroke="#dfe3ec"/><rect x="412" y="194" width="180" height="62" rx="10" fill="#fff" stroke="#dfe3ec"/>
    <text x="28" y="280" font-family="system-ui,sans-serif" font-size="15" fill="#667085">sticky top nav · sweep-fill</text>
  </g>

  <g transform="translate(750 150)" filter="url(#shadow)">
    <rect width="620" height="290" rx="18" fill="#f4efe6"/>
    <text x="28" y="38" font-family="Georgia,serif" font-size="23" font-weight="700" fill="#332b25">B · Elegant</text>
    <rect x="28" y="58" width="126" height="198" fill="#e9dfd0" stroke="#d8cabb"/>
    <g fill="#9b6849"><rect x="48" y="84" width="62" height="5"/><rect x="48" y="108" width="48" height="5"/><rect x="48" y="132" width="70" height="5"/></g>
    <rect x="180" y="58" width="412" height="72" fill="#fbf8f2" stroke="#d8cabb"/>
    <rect x="180" y="148" width="190" height="108" fill="#b8b1aa"/><rect x="388" y="148" width="204" height="108" fill="#fbf8f2" stroke="#d8cabb"/>
    <text x="180" y="280" font-family="system-ui,sans-serif" font-size="15" fill="#796d63">sticky left sidebar · filter reveal</text>
  </g>

  <g transform="translate(70 500)" filter="url(#shadow)">
    <rect width="620" height="290" rx="18" fill="#06070c"/>
    <text x="28" y="38" font-family="monospace" font-size="23" font-weight="700" fill="#00e5b8">C · CYBER_</text>
    <rect x="28" y="58" width="564" height="78" fill="#0d111b" stroke="#16483f"/>
    <rect x="28" y="152" width="270" height="80" fill="#0d111b" stroke="#16483f"/><rect x="322" y="152" width="270" height="80" fill="#0d111b" stroke="#ff3b82"/>
    <text x="28" y="248" font-family="monospace" font-size="15" fill="#72a9a0">fixed bottom dock · typing caret</text>
    <rect x="132" y="256" width="356" height="26" fill="#0d111b" stroke="#00e5b8"/>
    <g fill="#00e5b8"><rect x="160" y="266" width="42" height="5"/><rect x="224" y="266" width="42" height="5"/><rect x="288" y="266" width="42" height="5"/></g>
  </g>

  <g transform="translate(750 500)" filter="url(#shadow)">
    <rect width="620" height="290" rx="18" fill="url(#pop)"/>
    <text x="28" y="38" font-family="system-ui,sans-serif" font-size="23" font-weight="700" fill="#40234f">D · Colorful</text>
    <rect x="28" y="58" width="500" height="198" rx="24" fill="#fff" fill-opacity=".72" stroke="#b98fc9" stroke-opacity=".35"/>
    <circle cx="158" cy="156" r="54" fill="#f044a7" fill-opacity=".24"/><circle cx="252" cy="156" r="54" fill="#26c6da" fill-opacity=".24"/><circle cx="346" cy="156" r="54" fill="#ffb238" fill-opacity=".24"/>
    <rect x="548" y="82" width="44" height="142" rx="18" fill="#fff" fill-opacity=".8"/>
    <g fill="#f044a7"><circle cx="570" cy="112" r="5"/><circle cx="570" cy="142" r="5"/><circle cx="570" cy="172" r="5"/></g>
    <text x="28" y="280" font-family="system-ui,sans-serif" font-size="15" fill="#7f628b">viewport snap · right rail · pulse ring</text>
  </g>
</svg>
